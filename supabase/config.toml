# Local stack identifier only; hosted project refs belong outside source.
project_id = "lifeops-ai-local"

[api]
# Future client-readable tables need deliberate grants in their migrations.
auto_expose_new_tables = false

[db]
# Match this to the hosted projects before the first schema migration.
major_version = 17

[db.seed]
enabled = false

[auth]
additional_redirect_urls = ["lifeopsai://auth/callback"]

[auth.email]
enable_confirmations = true

[experimental]
stack = true
